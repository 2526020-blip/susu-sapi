<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk</title>

<style>

body{
  background:
  linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.85)),
  url('https://images.unsplash.com/photo-1491553895911-0055eca6402d');
  background-size:cover;
  background-position:center;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  display:flex;
  gap:40px;
  padding:60px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
}

.product-box{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(14px);
  border-radius:30px;
  padding:40px;
  display:flex;
  gap:40px;
  flex-wrap:wrap;
  border:1px solid rgba(255,255,255,0.08);
}

img{
  width:420px;
  border-radius:25px;
}

.info{
  max-width:500px;
}

h1{
  color:#ffe0e0;
  font-size:50px;
}

.price{
  color:#ffd6d6;
  font-size:35px;
  margin:20px 0;
}

p{
  color:#ddd;
  line-height:1.8;
}

button{
  padding:15px 30px;
  border:none;
  margin-right:20px;
  border-radius:14px;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

.cart{
  background:#ccc;
}

.buy{
  background:#f0cfcf;
}

button:hover{
  transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">

<div class="product-box">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

<div class="info">
  <h1>Sterling Red Shoes</h1>

  <div class="price">Rp 980.000.000</div>

  <p>
    Sepatu limited edition dengan material premium dan desain futuristik.
    Cocok untuk kolektor luxury fashion kelas atas.
  </p>

  <br>

  <button class="cart">Masukkan Keranjang</button>

  <a href="pengiriman.html">
    <button class="buy">Check Out</button>
  </a>

</div>

</div>

</div>

</body>
</html>
