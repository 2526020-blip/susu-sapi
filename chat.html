<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Produsen</title>

<style>

body{
  background:
  linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
  url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3');
  background-size:cover;
  color:white;
  font-family:Arial;
  margin:0;
}

.header{
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(14px);
  padding:20px;
  font-size:28px;
  color:#ffe1e1;
}

.chat-box{
  padding:40px;
}

.message{
  background:rgba(255,255,255,0.06);
  padding:25px;
  border-radius:25px;
  margin-bottom:20px;
  max-width:700px;
  backdrop-filter:blur(12px);
}

.product{
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
  margin-top:20px;
}

button{
  padding:12px 24px;
  background:#f0cfcf;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.home-btn{
  display:inline-block;
  margin-top:35px;
  background:white;
  color:black;
  padding:15px 25px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
Sterling Shop Chat
</div>

<div class="chat-box">

<div class="message">
Halo pelanggan elite 👑<br><br>
Produk Anda sedang dikirim menggunakan layanan VIP Delivery.
</div>

<div class="message">
Kami juga merekomendasikan produk premium lainnya.
</div>

<div class="product">
<h2>Diamond Watch X</h2>
<p>Jam tangan luxury eksklusif.</p>
<button>Beli Sekarang</button>
</div>

<div class="product">
<h2>Elite Headphone</h2>
<p>Headphone premium ultra jernih.</p>
<button>Beli Sekarang</button>
</div>

<a href="./index.html" class="home-btn">
⬅ Kembali ke Beranda
</a>

</div>

</body>
</html>
