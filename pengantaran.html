<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran & Pengiriman</title>

<style>

body{
  background:
  linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.92)),
  url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3');
  background-size:cover;
  color:white;
  font-family:Arial;
  margin:0;
}

.container{
  padding:50px;
}

.box{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(14px);
  border-radius:30px;
  padding:40px;
}

h1{
  color:#ffe1e1;
  margin-bottom:30px;
}

.payment-method{
  margin-top:30px;
}

.method{
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
  cursor:pointer;
  transition:0.3s;
}

.method:hover{
  background:rgba(255,255,255,0.1);
}

.road{
  position:relative;
  width:100%;
  height:240px;
  background:rgba(255,255,255,0.04);
  border-radius:25px;
  margin-top:40px;
}

.line{
  position:absolute;
  top:120px;
  width:100%;
  height:8px;
  background:repeating-linear-gradient(to right,white 0px,white 40px,transparent 40px,transparent 80px);
}

.truck{
  position:absolute;
  bottom:40px;
  left:-200px;
  font-size:100px;
  animation:drive 8s linear infinite;
}

.house{
  position:absolute;
  right:50px;
  bottom:35px;
  font-size:100px;
}

@keyframes drive{
  from{left:-200px;}
  to{left:100%;}
}

.btn{
  display:inline-block;
  margin-top:40px;
  background:#f0cfcf;
  color:black;
  padding:15px 28px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>Check Out Produk</h1>

<h2>Sterling Red Shoes</h2>
<p>Harga: Rp 980.000.000</p>
<p>Rating: ★★★★★</p>

<div class="payment-method">
<h2>Metode Pembayaran</h2>

<div class="method">💳 Bank BCA</div>
<div class="method">🏦 Bank BRI</div>
<div class="method">📱 Telkomsels SterlingPay</div>
<div class="method">💰 Dana Premium</div>
<div class="method">⚡ QRIS Luxury Payment</div>

</div>

<div class="road">
<div class="line"></div>
<div class="truck">🚚</div>
<div class="house">🏠</div>
</div>

<a href="./chat.html" class="btn">Lanjut ke Chat</a>

</div>

</div>

</body>
</html>
