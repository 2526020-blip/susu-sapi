<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengiriman</title>

<style>

body{
  background:#111;
  overflow:hidden;
  margin:0;
  font-family:Arial;
  color:white;
}

h1{
  text-align:center;
  margin-top:40px;
  color:red;
}

.road{
  position:relative;
  width:100%;
  height:300px;
  background:#222;
  margin-top:150px;
  border-top:5px solid white;
}

.line{
  position:absolute;
  top:145px;
  width:100%;
  height:10px;
  background:repeating-linear-gradient(
    to right,
    white 0px,
    white 50px,
    transparent 50px,
    transparent 100px
  );
}

.truck{
  position:absolute;
  bottom:50px;
  left:-300px;
  font-size:120px;
  animation:drive 8s linear infinite;
}

.house{
  position:absolute;
  right:100px;
  bottom:30px;
  font-size:120px;
}

@keyframes drive{
  from{
    left:-300px;
  }

  to{
    left:100%;
  }
}

.btn{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:red;
  padding:15px 30px;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

</style>
</head>

<body>

<h1>Produk Sedang Dikirim...</h1>

<div class="road">

  <div class="line"></div>

  <div class="truck">🚚</div>

  <div class="house">🏠</div>

</div>

<a href="chat.html" class="btn">
  Lanjut ke Chat Produsen
</a>

</body>
</html>
